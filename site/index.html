<html lang="en">

  <meta name="theme-color" content="#f6f8f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121a26" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%232f6b4f'/><path d='M32 50V30M32 34l-10-10M32 30l9-9M22 24v-6M41 21v-5' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/></svg>">

</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="Paida Roots home">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32"/><path d="M32 50V30M32 34l-10-10M32 30l9-9M22 24v-6M41 21v-5"/></svg>
      <span class="brand-name">Paida Roots</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-nav="tree">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8m0 0-5-5m5 5 5-5M7 8V4m10 4V4"/></svg>
        <span>Tree</span></a>
      <a href="#/people" data-nav="people">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>
        <span>People</span></a>
      <a href="#/stories" data-nav="stories">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5Zm0 0v13"/></svg>

        <span>About</span></a>
    </nav>
    <div class="tools">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Find a person" autocomplete="off" aria-label="Find a person">
        <ul id="results" hidden></ul>
      </div>
      <div class="lang" role="group" aria-label="Show names in">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="or" class="or">ଓଡ଼ିଆ</button>
      </div>
    </div>
  </header>
  <main id="app"><p class="muted">Loading the family…</p></main>
  <footer class="foot">
    <p>Paida Roots keeps the families and story of Paida village, so they are never lost. <span id="updated"></span></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
